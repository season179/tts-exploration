[project]
name = "tts-local"
version = "0.2.0"
description = "Local Qwen3-TTS daemon + CLI for Apple Silicon (M4A/WAV, agent-friendly)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio==0.4.7",
    "mlx==0.32.0",
    "mlx-lm==0.31.3",
    "numpy==2.5.1",
    "transformers==5.14.1",
    "huggingface-hub==1.27.0",  # imported directly (model cache checks)
]

[project.scripts]
tts = "tts_local.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tts_local"]
