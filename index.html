<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local TTS — Qwen3</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
  }
  h1 { font-size: 1.3rem; }
  textarea {
    width: 100%; min-height: 180px; box-sizing: border-box;
    font: inherit; padding: .6rem; border-radius: 8px; border: 1px solid #8886;
  }
  input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; padding: .45rem .6rem;
    border-radius: 8px; border: 1px solid #8886;
  }
  .row { display: flex; gap: 1rem; align-items: center; margin: .8rem 0; flex-wrap: wrap; }
  select, button { font: inherit; padding: .45rem .8rem; border-radius: 8px; }
  button { cursor: pointer; border: 1px solid #8886; background: #4a7dff; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: .8rem 0; min-height: 1.4em; }
  #status.error { color: #d33; }
  progress { width: 100%; height: 10px; }
  #result { margin-top: 1rem; }
  audio { width: 100%; }
  .hint { font-size: .85rem; opacity: .7; }
  .charcount { margin-left: auto; font-size: .85rem; opacity: .7; }
</style>
</head>
<body>
<h1>Local TTS — Qwen3 CustomVoice</h1>
<p class="hint">Aiden speaks English, Serena speaks Chinese. Auto picks by script. Max 10,000 characters.</p>

<textarea id="text" placeholder="Paste text here…" maxlength="10000"></textarea>

<div class="row">
  <label>Language
    <select id="language">
      <option value="auto" selected>Auto</option>
      <option value="english">English (Aiden)</option>
      <option value="chinese">Chinese (Serena)</option>
    </select>
  </label>
  <span class="charcount"><span id="count">0</span> / 10000</span>
</div>

<details>
  <summary>Narration style</summary>
  <div class="row">
    <input type="text" id="instruction" maxlength="500"
           value="Calm, clear audiobook narration. Natural pacing, restrained emotion, precise pronunciation, and comfortable pauses between paragraphs."
           placeholder="Optional narration instruction">
  </div>
</details>

<div class="row">
  <button id="generate">Generate</button>
</div>

<div id="status"></div>
<progress id="bar" max="1" value="0" style="display:none"></progress>

<div id="result">
  <audio id="player" controls aria-label="Generated audio"></audio>
  <p id="downloadRow" style="display:none"><a id="download" download>Download WAV</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
let pollTimer = null;

$("text").addEventListener("input", () => { $("count").textContent = $("text").value.length; });

$("generate").addEventListener("click", async () => {
  const text = $("text").value.trim();
  if (!text) { setStatus("Enter some text first.", true); return; }

  clearInterval(pollTimer);
  $("player").removeAttribute("src");
  $("player").load();
  $("downloadRow").style.display = "none";
  $("generate").disabled = true;
  $("bar").style.display = "none";
  setStatus("Submitting…");

  try {
    const res = await fetch("/speak", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text,
        language: $("language").value,
        instruction: $("instruction").value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    poll(data.id);
  } catch (err) {
    setStatus("Error: " + err.message, true);
    $("generate").disabled = false;
  }
});

function poll(id) {
  pollTimer = setInterval(async () => {
    try {
      const res = await fetch(`/status/${id}`);
      const s = await res.json();
      if (!res.ok) throw new Error(s.error || res.statusText);

      if (s.status === "queued") {
        setStatus(`Queued (position ${s.queue_position + 1})…`);
      } else if (s.status === "running") {
        const total = s.chunks_total || 0;
        if (total > 0) {
          $("bar").style.display = "";
          $("bar").max = total;
          $("bar").value = s.chunks_done;
          setStatus(`Generating with ${s.voice}… chunk ${Math.min(s.chunks_done + 1, total)} of ${total}`);
        } else {
          setStatus("Preparing…");
        }
      } else if (s.status === "done") {
        clearInterval(pollTimer);
        $("bar").style.display = "none";
        setStatus(`Done — ${s.duration_sec}s of audio (${s.voice}) generated in ${s.generation_sec}s.`);
        $("player").src = s.audio_url;
        $("download").href = s.audio_url;
        $("downloadRow").style.display = "";
        $("generate").disabled = false;
      } else if (s.status === "error") {
        clearInterval(pollTimer);
        $("bar").style.display = "none";
        setStatus("Generation failed: " + (s.error || "unknown error"), true);
        $("generate").disabled = false;
      }
    } catch (err) {
      clearInterval(pollTimer);
      setStatus("Error: " + err.message, true);
      $("generate").disabled = false;
    }
  }, 700);
}

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}
</script>
</body>
</html>
