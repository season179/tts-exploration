<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local TTS — Qwen3</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5;
  }
  h1 { font-size: 1.3rem; }
  textarea {
    width: 100%; min-height: 180px; box-sizing: border-box;
    font: inherit; padding: .6rem; border-radius: 8px; border: 1px solid #8886;
  }
  input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; padding: .45rem .6rem;
    border-radius: 8px; border: 1px solid #8886;
  }
  .row { display: flex; gap: 1rem; align-items: center; margin: .8rem 0; flex-wrap: wrap; }
  select, button { font: inherit; padding: .45rem .8rem; border-radius: 8px; }
  button { cursor: pointer; border: 1px solid #8886; background: #4a7dff; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  #status { margin: .8rem 0; min-height: 1.4em; }
  #status.error { color: #d33; }
  progress { width: 100%; height: 10px; }
  #result { margin-top: 1rem; }
  audio { width: 100%; }
  .hint { font-size: .85rem; opacity: .7; }
  .charcount { margin-left: auto; font-size: .85rem; opacity: .7; }
</style>
</head>
<body>
<h1>Local TTS — Qwen3 CustomVoice</h1>
<p class="hint">Aiden speaks English, Serena speaks Chinese. Auto picks by script. Max 10,000 characters.</p>

<textarea id="text" placeholder="Paste text here…" maxlength="10000"></textarea>

<div class="row">
  <label>Language
    <select id="language">
      <option value="auto" selected>Auto</option>
      <option value="english">English (Aiden)</option>
      <option value="chinese">Chinese (Serena)</option>
    </select>
  </label>
  <label>Format
    <select id="format">
      <option value="m4a" selected>M4A</option>
      <option value="wav">WAV</option>
    </select>
  </label>
  <span class="charcount"><span id="count">0</span> / 10000</span>
</div>

<details>
  <summary>Narration style</summary>
  <div class="row">
    <input type="text" id="instruction" maxlength="500"
           placeholder="Optional, e.g. “Calm, clear audiobook narration.” — can cause overlong output on short or Chinese text">
  </div>
</details>

<div class="row">
  <button id="generate">Generate</button>
</div>

<div id="status"></div>
<progress id="bar" max="1" value="0" style="display:none"></progress>

<div id="result">
  <audio id="player" controls aria-label="Generated audio"></audio>
  <p id="downloadRow" style="display:none"><a id="download">Download</a></p>
</div>

<script>
// The access token rides in the URL fragment (never sent to the server, not
// baked into this page — / is served unauthenticated). Get the full URL from
// `tts daemon status`.
const TOKEN = decodeURIComponent(location.hash.slice(1));
const $ = id => document.getElementById(id);
let pollTimer = null;
let blobUrl = null;

const api = (path, opts = {}) => fetch(path, {
  ...opts,
  headers: {
    "Authorization": `Bearer ${TOKEN}`,
    ...(opts.body ? { "Content-Type": "application/json" } : {}),
    ...(opts.headers || {}),
  },
});

const errMsg = (data, res) =>
  (data && data.error && data.error.message) || res.statusText;

$("text").addEventListener("input", () => { $("count").textContent = $("text").value.length; });

if (!TOKEN) {
  setStatus("Missing access token — open this page via the URL printed by “tts daemon status”.", true);
  $("generate").disabled = true;
}

$("generate").addEventListener("click", async () => {
  const text = $("text").value.trim();
  if (!text) { setStatus("Enter some text first.", true); return; }

  clearInterval(pollTimer);
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
  $("player").removeAttribute("src");
  $("player").load();
  $("downloadRow").style.display = "none";
  $("generate").disabled = true;
  $("bar").style.display = "none";
  setStatus("Submitting…");

  try {
    const res = await api("/v1/jobs", {
      method: "POST",
      body: JSON.stringify({
        text,
        language: $("language").value,
        format: $("format").value,
        instruction: $("instruction").value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(errMsg(data, res));
    poll(data.id);
  } catch (err) {
    setStatus("Error: " + err.message, true);
    $("generate").disabled = false;
  }
});

function poll(id) {
  pollTimer = setInterval(async () => {
    try {
      const res = await api(`/v1/jobs/${id}`);
      const s = await res.json();
      if (!res.ok) throw new Error(errMsg(s, res));

      if (s.status === "queued") {
        setStatus(`Queued (position ${s.queue_position + 1})…`);
      } else if (s.status === "running") {
        const total = s.chunks_total || 0;
        if (total > 0) {
          $("bar").style.display = "";
          $("bar").max = total;
          $("bar").value = s.chunks_done;
          setStatus(`Generating with ${s.voice}… chunk ${Math.min(s.chunks_done + 1, total)} of ${total}`);
        } else {
          setStatus("Preparing…");
        }
      } else if (s.status === "done") {
        clearInterval(pollTimer);
        $("bar").style.display = "none";
        setStatus(`Done — ${s.duration_sec}s of audio (${s.voice}) generated in ${s.generation_sec}s.`);
        await showAudio(s);
        $("generate").disabled = false;
      } else if (s.status === "failed" || s.status === "canceled") {
        clearInterval(pollTimer);
        $("bar").style.display = "none";
        const msg = (s.error && s.error.message) || s.status;
        setStatus("Generation failed: " + msg, true);
        $("generate").disabled = false;
      }
    } catch (err) {
      clearInterval(pollTimer);
      setStatus("Error: " + err.message, true);
      $("generate").disabled = false;
    }
  }, 700);
}

async function showAudio(s) {
  const res = await api(s.audio_url);
  if (!res.ok) throw new Error("audio fetch failed: " + res.statusText);
  const blob = await res.blob();
  blobUrl = URL.createObjectURL(blob);
  $("player").src = blobUrl;
  const name = `tts-${s.id.slice(0, 8)}.${s.format}`;
  $("download").href = blobUrl;
  $("download").download = name;
  $("download").textContent = `Download ${s.format.toUpperCase()}`;
  $("downloadRow").style.display = "";
}

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = isError ? "error" : "";
}
</script>
</body>
</html>
